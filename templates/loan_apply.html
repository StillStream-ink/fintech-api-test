{% extends "base.html" %}

{% block title %}贷款申请 - Fintech 信贷{% endblock %}

{% block content %}
<h1>贷款申请</h1>

<form id="loanForm" class="form">
    <div class="form-row">
        <label for="customer_id">客户 ID：</label>
        <input type="number" id="customer_id" name="customer_id" placeholder="客户 ID" required>
    </div>
    <div class="form-row">
        <label for="amount">贷款金额：</label>
        <input type="number" id="amount" name="amount" placeholder="贷款金额（元）" required>
    </div>
    <button type="submit" class="btn btn-primary">提交申请</button>
</form>

<div id="message" class="message"></div>

<script>
document.getElementById('loanForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
        customer_id: parseInt(document.getElementById('customer_id').value),
        amount: parseInt(document.getElementById('amount').value),
    };

    const msg = document.getElementById('message');
    try {
        const resp = await fetch('/api/v1/loan', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload),
        });
        const data = await resp.json();

        if (resp.status === 201) {
            msg.className = 'message success';
            msg.textContent = `✅ 贷款申请成功！贷款 ID：${data.loan_id}，状态：${data.status}`;
        } else {
            msg.className = 'message error';
            msg.textContent = `❌ 申请失败：${data.error || JSON.stringify(data)}`;
        }
    } catch (err) {
        msg.className = 'message error';
        msg.textContent = `❌ 请求异常：${err.message}`;
    }
});
</script>
{% endblock %}
