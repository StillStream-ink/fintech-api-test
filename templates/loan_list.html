{% extends "base.html" %}

{% block title %}贷款列表 - Fintech 信贷{% endblock %}

{% block content %}
<h1>贷款列表</h1>

<div class="form-row">
    <label for="loanId">按 ID 查询：</label>
    <input type="number" id="loanId" placeholder="贷款 ID">
    <button id="searchBtn" class="btn">查询</button>
    <button id="loadAllBtn" class="btn">加载全部</button>
</div>

<table id="loanTable" class="table">
    <thead>
        <tr>
            <th>贷款 ID</th>
            <th>客户 ID</th>
            <th>金额</th>
            <th>状态</th>
        </tr>
    </thead>
    <tbody id="loanTableBody"></tbody>
</table>

<div id="message" class="message"></div>

<script>
function renderRow(loan) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td>${loan.loan_id}</td>
        <td>${loan.customer_id}</td>
        <td>${loan.amount}</td>
        <td>${loan.status}</td>
    `;
    return tr;
}

document.getElementById('searchBtn').addEventListener('click', async () => {
    const loanId = document.getElementById('loanId').value;
    const msg = document.getElementById('message');
    const tbody = document.getElementById('loanTableBody');
    tbody.innerHTML = '';

    if (!loanId) {
        msg.className = 'message error';
        msg.textContent = '请输入贷款 ID';
        return;
    }

    try {
        const resp = await fetch(`/api/v1/view-loan/${loanId}`);
        const data = await resp.json();

        if (resp.status === 200) {
            tbody.appendChild(renderRow(data));
            msg.className = 'message success';
            msg.textContent = `✅ 找到贷款 ${loanId}`;
        } else {
            msg.className = 'message error';
            msg.textContent = `❌ ${data.error || '未找到'}`;
        }
    } catch (err) {
        msg.className = 'message error';
        msg.textContent = `❌ 请求异常：${err.message}`;
    }
});

document.getElementById('loadAllBtn').addEventListener('click', async () => {
    const msg = document.getElementById('message');
    const tbody = document.getElementById('loanTableBody');
    tbody.innerHTML = '';

    // 遍历 id 1~20，看哪些存在
    let found = 0;
    for (let id = 1; id <= 20; id++) {
        try {
            const resp = await fetch(`/api/v1/view-loan/${id}`);
            if (resp.status === 200) {
                const data = await resp.json();
                tbody.appendChild(renderRow(data));
                found++;
            }
        } catch (e) {}
    }
    msg.className = 'message success';
    msg.textContent = `✅ 加载完成，共 ${found} 条`;
});
</script>
{% endblock %}
