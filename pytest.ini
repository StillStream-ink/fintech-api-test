[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .

addopts =
    -v
    -s
    --tb=short
    --strict-markers
    -p no:playwright
    --alluredir=allure-results
    --junitxml=test-results/junit.xml
    --cov=api
    --cov=credit_api
    --cov=schemas
    --cov=tests
    --cov-report=term-missing
    --cov-report=html:reports/coverage
    --cov-report=xml:reports/coverage.xml

markers =
    smoke: 冒烟用例
    regression: 回归用例
    api: API 测试
    credit: 信贷模块
    register: 注册模块
    eligibility: 资格检查
    loan: 贷款模块
    security: 安全测试
    p0: 核心用例
    p1: 重要用例