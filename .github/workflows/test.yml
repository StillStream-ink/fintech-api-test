name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run pytest + coverage + quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==================== CI：测试 ====================

      - name: Run tests with coverage
        run: python -m pytest
        env:
          FLASK_DEBUG: "0"

      - name: Run quality gate
        run: python scripts/quality_gate.py --threshold 90

      # ==================== 归档产物 ====================

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: reports/coverage/
          retention-days: 7

      - name: Upload junit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: test-results/junit.xml
          retention-days: 7

      - name: Upload test scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-scores
          path: reports/test_scores.txt
          retention-days: 7

      # ==================== CD：部署 Allure 报告到 GitHub Pages ====================

      - name: Setup Java (Allure 依赖)
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Allure CLI
        if: always()
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.24.1/allure-2.24.1.tgz
          tar -xzf allure-2.24.1.tgz
          sudo mv allure-2.24.1 /opt/allure
          sudo ln -sf /opt/allure/bin/allure /usr/bin/allure
          allure --version

      - name: Generate Allure report
        if: always()
        run: |
          echo "===== allure-results content ====="
          ls -la allure-results/ || echo "NOT FOUND"
          echo "===== generating report ====="
          allure generate allure-results -o allure-report --clean
          echo "===== allure-report content ====="
          ls -la allure-report/

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-report
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
