name: Fintech API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Allure CLI
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.30.0/allure-2.30.0.tgz
          sudo tar -zxf allure-2.30.0.tgz -C /opt/
          sudo ln -sf /opt/allure-2.30.0/bin/allure /usr/local/bin/allure
          allure --version

      - name: Start mock server
        env:
          FLASK_DEBUG: "0"
        run: |
          nohup python app.py > /tmp/flask.log 2>&1 &
          echo "Mock server starting..."

      - name: Wait for mock server
        run: |
          for i in {1..20}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:5000/api/v1/_reset_db || true)
            if [ "$code" = "200" ]; then
              echo "Mock server ready (attempt $i)"
              exit 0
            fi
            echo "Waiting... ($i/20)"
            sleep 1
          done
          echo "Mock server failed to start"
          cat /tmp/flask.log
          exit 1

      - name: Run tests
        run: pytest tests -q --alluredir=allure-results

      - name: Quality gate
        run: python scripts/quality_gate.py
        continue-on-error: false

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d allure-results ]; then
            allure generate allure-results --clean -o allure-report
          else
            mkdir -p allure-report
            echo "<h1>No test results</h1>" > allure-report/index.html
          fi

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            allure-results/
            test-results/
          retention-days: 30

  deploy:
    needs: test
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
